<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">DQ Report</title>
<style>
:root{--pass:#2da44e;--warn:#d97706;--fail:#e53e3e;--error:#c0392b;--skip:#8c959f;
  --bg:#f6f8fa;--card:#fff;--hdr:#0d1117;--border:#d0d7de;--txt:#24292f;--txt2:#656d76}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}

/* ── Header ── */
.hdr{background:var(--hdr);color:#e6edf3;padding:18px 32px}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hdr h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:5px}
.hdr-meta{font-size:12px;color:#8b949e;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hdr-meta b{color:#e6edf3}
.hdr-stats{display:flex;gap:20px;font-size:12px;color:#8b949e;flex-wrap:wrap}
.hdr-stats span b{color:#e6edf3}
.verdict{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;align-self:flex-start}
.verdict.passed{background:#1a4731;color:#3fb950;border:1px solid #238636}
.verdict.warned{background:#341a00;color:#d29922;border:1px solid #9e6a03}
.verdict.failed{background:#490202;color:#f85149;border:1px solid #da3633}

/* ── Filter bar ── */
.fbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 32px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.flabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-right:2px}
.fsep{width:1px;height:20px;background:var(--border);margin:0 6px}
.pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--txt2);user-select:none;transition:all .15s}
.pill:hover{background:#f3f4f6}
.pill.active{color:#fff;border-color:transparent}
.pill.active.s-all{background:#24292f}.pill.active.s-pass{background:var(--pass)}
.pill.active.s-warn{background:var(--warn)}.pill.active.s-fail{background:var(--fail)}
.pill.active.s-error{background:var(--error)}.pill.active.s-skip{background:var(--skip)}
.pill.active.c-all{background:#0969da}.pill.active.c-check{background:#0969da}
.search{margin-left:auto;padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;width:200px;outline:none}
.search:focus{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.15)}

/* ── Content ── */
.content{padding:18px 32px;max-width:1400px}

/* ── Summary cards ── */
.cards{display:flex;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.cards-sub{font-size:11px;color:var(--txt2);margin-bottom:18px;padding-left:2px}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 22px;min-width:100px}
.card .num{font-size:36px;font-weight:700;line-height:1}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--txt2);margin-top:3px}
.card.pass .num{color:var(--pass)}.card.warn .num{color:var(--warn)}
.card.fail .num{color:var(--fail)}.card.error .num{color:var(--error)}.card.skip .num{color:var(--skip)}
.cov-card{flex:1;min-width:280px}
.cov-bar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:#eee;margin:8px 0 4px}
.cov-pass{background:var(--pass)}.cov-warn{background:var(--warn)}.cov-fail{background:var(--fail)}
.cov-text{font-size:12px;color:var(--txt2)}

/* ── Check summary table ── */
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:15px;background:#0969da;border-radius:2px;display:inline-block}
.stbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:18px;font-size:13px}
.stbl th{background:#f6f8fa;padding:8px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2);border-bottom:1px solid var(--border);font-weight:600}
.stbl th.r{text-align:center}
.stbl td{padding:9px 14px;border-bottom:1px solid #f1f3f5;vertical-align:middle}
.stbl tr:last-child td{border-bottom:none}
.stbl td.r{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stbl td.r.pass{color:var(--pass)}.stbl td.r.warn{color:var(--warn)}.stbl td.r.fail{color:var(--fail)}.stbl td.r.error{color:var(--error)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.pass{background:var(--pass)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}
.mini-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#eee;width:80px;display:inline-block}
.mini-fill{background:var(--pass);height:100%;display:block}
.rate-cell{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt2)}

/* ── Tooltips ── */
[data-tip]{position:relative;cursor:help}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:#24292f;color:#e6edf3;font-size:11px;font-weight:400;line-height:1.45;padding:6px 10px;
  border-radius:5px;white-space:normal;max-width:240px;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .15s;z-index:200}
[data-tip]::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#24292f;pointer-events:none;opacity:0;transition:opacity .15s;z-index:200}
[data-tip]:hover::after,[data-tip]:hover::before{opacity:1}

/* ── Instance block ── */
.inst{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.inst-hdr{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
.inst-hdr:hover{background:#f6f8fa}
.inst-icon{font-size:14px}
.inst-name{font-weight:600;font-size:14px;flex:1}
.inst-badges{display:flex;gap:5px}
.ibadge{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.ibadge.pass{background:#e6f4ea;color:var(--pass)}.ibadge.warn{background:#fff8e6;color:var(--warn)}
.ibadge.fail{background:#ffeaea;color:var(--fail)}.ibadge.error{background:#fdecea;color:var(--error)}
.chev{transition:transform .2s;font-size:10px;color:var(--txt2)}
.chev.open{transform:rotate(90deg)}

/* ── Check group ── */
.grp{border-top:1px solid #f1f3f5}
.grp-hdr{padding:7px 16px;display:flex;align-items:center;gap:10px;background:#f8f9fa;cursor:pointer;user-select:none}
.grp-hdr:hover{background:#eef1f4}
.grp-name{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt2);flex:1}
.grp-badges{display:flex;gap:4px}

/* ── Result rows ── */
.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th{padding:6px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2);background:#fafbfc;border-bottom:1px solid #f1f3f5;font-weight:600}
.rtbl th.r{text-align:right}
.rtbl td{padding:8px 16px;border-bottom:1px solid #f8f9fa;vertical-align:middle}
.rtbl tr:last-child td{border-bottom:none}
.rtbl tr:hover td{background:#f6f8fa}
.rtbl td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2)}
.sbadge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sbadge.pass{background:#e6f4ea;color:var(--pass)}.sbadge.warn{background:#fff8e6;color:var(--warn)}
.sbadge.fail{background:#ffeaea;color:var(--fail)}.sbadge.error{background:#fdecea;color:var(--error)}
.sbadge.skip{background:#f0f0f0;color:var(--skip)}
.detail{font-size:11px;color:var(--txt2);margin-top:2px}
.hidden{display:none!important}

/* ── Bucket (classification) ── */
.cls-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-right:5px;vertical-align:middle}
.cls-badge.optin{background:#e6f4ea;color:#1a7f37}
.cls-badge.pii{background:#ffeaea;color:#c0392b}
.cls-badge.optout{background:#e8f0fe;color:#1558d6}
.bkt{border-top:1px solid var(--border)}
.bkt-hdr{padding:8px 16px;display:flex;align-items:center;gap:10px;background:#f0f2f4;cursor:pointer;user-select:none}
.bkt-hdr:hover{background:#eaecef}
.bkt-name{font-weight:700;font-size:12px;flex:1}
</style>
</head>

// ── Check definitions ──────────────────────────────────────────────────────
const CHECK_TYPES = [
  { key:'row_count',       label:'Row Count',        icon:'☰', desc:'Total rows in each Iceberg table. WARN if empty; WARN if row count changed >20% vs previous snapshot (Δ).' },
  { key:'source_target',   label:'Source → Target',  icon:'⇌', desc:'Source parquet row count vs Iceberg Silver row count. Catches data loss during ingestion. Full-load only — skipped for incremental (source files are deltas).' },
  { key:'schema_contract', label:'Schema Contract',  icon:'✦', desc:'Checks that required platform columns are present: ingestion_timestamp, execution_id, instance. FAIL if any are missing.' },
  { key:'null_rate',       label:'Null Rate',         icon:'◎', desc:'Incremental: null % on PK columns only (FAIL if >75%). Full-load: null % across all columns on a 10k-row sample (WARN if >20%).' },
  { key:'duplicate_pk',    label:'Dedup',             icon:'⧉', desc:'Counts rows with duplicate primary key values. FAIL if any duplicates found. PKs come from cdc.primary_keys in config. SKIP if PK column not found in table schema.' },
  { key:'freshness',       label:'Freshness',         icon:'◷', desc:'Hours since the last Iceberg snapshot was written. PASS ≤48h · WARN ≤168h · FAIL >168h. Catches tables where the pipeline has stopped delivering data.' },
  { key:'cls_routing',     label:'Bucket Routing',    icon:'◈', desc:'Verifies PII tables are in the pii bucket and non-PII tables are not in pii. FAIL if a table is in the wrong S3 Table bucket — a compliance risk.' },
];

// ── Per-row per-check status ───────────────────────────────────────────────
function checkStatus(r, key) {
  if (key === 'row_count') {
    if (r.row_count_error) return { s:'error', detail: r.row_count_error };
    const rc = r.row_count ?? 0;
    if (rc === 0 && r.last_snapshot_hours_ago != null) return { s:'warn', detail:'empty table' };
    const dp = r.row_delta_pct;
    if (dp != null && dp > 20) return { s:'warn', detail:`Δ${dp > 0 ? '+' : ''}${dp.toFixed(1)}%` };
    return { s:'pass', detail: rc.toLocaleString() + ' rows' };
  }
  if (key === 'source_target') {
    const st = r.source_count_status;
    if (!st || st === 'SKIP') return { s:'skip', detail:'incremental / no path' };
    if (st === 'PASS') return { s:'pass', detail:`src=${(r.source_count_source_rows??0).toLocaleString()}` };
    if (st === 'FAIL') return { s:'fail', detail:`Δ${(r.source_count_delta??0).toLocaleString()} rows` };
    return { s:'error', detail:(r.source_count_detail||'').slice(0,80) };
  }
  if (key === 'schema_contract') {
    const st = r.schema_contract_status;
    if (!st) return { s:'skip', detail:'—' };
    if (st === 'PASS') return { s:'pass', detail:`${r.column_count??'?'} cols` };
    const missing = (r.schema_contract_missing||[]).join(', ');
    return { s:'fail', detail:`missing: ${missing}` };
  }
  if (key === 'null_rate') {
    const pk = r.pk_null_status;
    if (pk === 'SKIP') return { s:'skip', detail:'PK col not found in table' };
    if (pk === 'FAIL') return { s:'fail', detail:'PK has nulls' };
    if (pk === 'WARN') return { s:'warn', detail:'PK partial nulls' };
    const hn = r.high_nulls || {};
    const cols = Object.entries(hn).sort((a,b)=>b[1]-a[1]);
    if (cols.length === 0) return { s:'pass', detail:'no high nulls' };
    const top = cols.slice(0,3).map(([c,v])=>`${c}=${v}%`).join('  ');
    return { s:'warn', detail: top + (cols.length > 3 ? ` +${cols.length-3} more` : '') };
  }
  if (key === 'duplicate_pk') {
    if ('pk_error' in r) return { s:'error', detail: (r.pk_error||'').slice(0,80) };
    const dup = r.duplicate_pks;
    if (dup == null) return { s:'skip', detail:'no PKs defined' };
    if (dup === -1)  return { s:'skip', detail:'PK col not found in table schema' };
    if (dup === 0)   return { s:'pass', detail:`0 dups (${(r.pk_cols||[]).join(', ')})` };
    return { s:'fail', detail:`${dup.toLocaleString()} dups on ${(r.pk_cols||[]).join(', ')}` };
  }
  if (key === 'freshness') {
    const h = r.last_snapshot_hours_ago;
    if (h == null) return { s:'skip', detail:'no snapshot' };
    if (h <= 48)  return { s:'pass',  detail:`${h}h ago` };
    if (h <= 168) return { s:'warn',  detail:`${h}h ago` };
    return { s:'fail', detail:`${h}h ago (stale)` };
  }
  if (key === 'cls_routing') {
    const st = r.cls_routing;
    if (!st || st === 'SKIP') return { s:'skip', detail: r.cls_routing_msg || '—' };
    if (st === 'PASS') return { s:'pass', detail:`${r.classification||'?'} bucket ✓` };
    return { s:'fail', detail: (r.cls_routing_msg||'wrong bucket').slice(0,100) };
  }
  return { s:'skip', detail:'—' };
}

function rowOverallStatus(r) {
  if (r.row_count_error) return 'error';
  const statuses = CHECK_TYPES.map(c => checkStatus(r, c.key).s);
  if (statuses.includes('error')) return 'error';
  if (statuses.includes('fail'))  return 'fail';
  if (statuses.includes('warn'))  return 'warn';
  return 'pass';
}

// ── Aggregate stats ────────────────────────────────────────────────────────
function aggregateByCheck(rows) {
  return CHECK_TYPES.map(ct => {
    const counts = {pass:0,warn:0,fail:0,error:0,skip:0};
    rows.forEach(r => {
      if ('status' in r) return;
      counts[checkStatus(r, ct.key).s]++;
    });
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    const passRate = total > 0 ? Math.round((counts.pass / (total - counts.skip)) * 100) || 0 : 0;
    return { ...ct, ...counts, total, passRate };
  });
}

// ── Bucket constants ──────────────────────────────────────────────────────
const CLS_LIST  = ['optin','pii','optout'];
const CLS_ICONS = {optin:'🟢',pii:'🔴',optout:'🔵'};

// ── Filter state ──────────────────────────────────────────────────────────
let filterStatus = 'all';
let filterCheck  = 'all';
let filterSearch = '';

function matchesFilter(r, checkKey) {
  if ('status' in r) return false;
  const os = rowOverallStatus(r);
  if (filterStatus !== 'all' && os !== filterStatus) return false;
  const tbl = (r.table||'').toLowerCase();
  if (filterSearch && !tbl.includes(filterSearch.toLowerCase())) return false;
  if (filterCheck !== 'all' && checkKey !== filterCheck) return false;
  return true;
}

// ── Rendering ─────────────────────────────────────────────────────────────
const m = D.meta;
const tableRows = D.rows.filter(r => !('status' in r) && !r.row_count_error || r.row_count_error);
const ok = tableRows.filter(r => rowOverallStatus(r)==='pass').length;
const wn = tableRows.filter(r => rowOverallStatus(r)==='warn').length;
const fl = tableRows.filter(r => rowOverallStatus(r)==='fail').length;
const er = tableRows.filter(r => rowOverallStatus(r)==='error').length;
const sk = tableRows.filter(r => rowOverallStatus(r)==='skip').length;
const total = tableRows.length;
const _allCheckAgg = aggregateByCheck(tableRows);
const activeCheckKeys = new Set(_allCheckAgg.filter(c => {
  if ((c.total - c.skip) > 0) return true;
  // Show dedup even when all-SKIP if PKs were configured (duplicate_pks === -1 signals col-not-found)
  if (c.key === 'duplicate_pk') return tableRows.some(r => r.duplicate_pks != null);
  // Show null_rate even when all-SKIP if PK null check was attempted (pk_null_status set)
  if (c.key === 'null_rate')    return tableRows.some(r => r.pk_null_status != null);
  return false;
}).map(c => c.key));
// Exclude skip from both numerator and denominator so skipped check types
// don't dilute the pass rate (e.g. source_target always skip for incremental).
const totalChecks = tableRows.reduce((acc,r)=>{
  CHECK_TYPES.forEach(c=>{ if(checkStatus(r,c.key).s!=='skip') acc++; }); return acc; }, 0);
const passChecks  = tableRows.reduce((acc,r)=>{
  CHECK_TYPES.forEach(c=>{ if(checkStatus(r,c.key).s==='pass') acc++; }); return acc; }, 0);
const passRate = totalChecks > 0 ? Math.round(passChecks*100/totalChecks) : 0;

function verdict() {
  if (er > 0 || fl > 0) return {cls:'failed', icon:'✗', txt:'FAILED'};
  if (wn > 0)           return {cls:'warned', icon:'△', txt:'WARNING'};
  return                       {cls:'passed', icon:'✓', txt:'PASSED'};
}
const vd = verdict();
const dur = m.duration_s < 60 ? `${m.duration_s.toFixed(0)}s` : `${(m.duration_s/60).toFixed(1)}min`;

// Header
document.getElementById('hdr-root').innerHTML = `
<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>DI Data Validator — ${esc(m.powerapp.toUpperCase())}</h1>
      <div class="hdr-meta">
        <span>Namespace: <b>${esc(m.namespace)}</b></span>
        <span>·</span>
        <span>Environment: <b>${esc(m.env)}</b></span>
        <span>·</span>
        <span>Mode: <b>${esc(m.mode)}</b></span>
        <span>·</span>
        <span><b>${esc(m.timestamp)}</b> UTC</span>
      </div>
      <div class="hdr-stats">
        <span>Duration <b>${dur}</b></span>
        <span>Tables <b>${total}</b></span>
        <span>Total checks <b>${totalChecks}</b></span>
        <span>Pass rate <b>${passRate}%</b></span>
        <span>Total rows <b>${m.total_rows.toLocaleString()}</b></span>
      </div>
    </div>
    <div class="verdict ${vd.cls}">${vd.icon} ${vd.txt}</div>
  </div>
</div>`;

// Filter bar
function renderFilters() {
  const sp = (s,label,icon='') => `<span class="pill s-${s} ${filterStatus===s?'active':''}" onclick="setStatus('${s}')">${icon} ${label}</span>`;
  const cp = (c,label,icon='',desc='') => `<span class="pill c-${c==='all'?'all':'check'} ${filterCheck===c?'active':''}" onclick="setCheck('${c}')"${desc?` data-tip="${esc(desc)}"`:''}>${icon} ${label}</span>`;
  document.getElementById('fbar-root').innerHTML = `
    <span class="flabel">Status</span>
    ${sp('all','All')} ${sp('pass','✓ Pass')} ${sp('warn','△ Warn')}
    ${sp('fail','✗ Fail')} ${sp('error','! Error')} ${sp('skip','– Skip')}
    <div class="fsep"></div>
    <span class="flabel">Check</span>
    ${cp('all','All Checks')}
    ${CHECK_TYPES.filter(c=>activeCheckKeys.has(c.key)).map(c=>cp(c.key, c.icon+' '+c.label,'',c.desc||'')).join('')}
    <input class="search" placeholder="Search table name…" value="${esc(filterSearch)}"
      oninput="setSearch(this.value)">`;
}

function setStatus(s){ filterStatus=s; renderFilters(); renderContent(); }
function setCheck(c){ filterCheck=c;   renderFilters(); renderContent(); }
function setSearch(v){ filterSearch=v; renderFilters(); renderContent(); }

renderFilters();

// Content
function renderContent() {
  const checkAgg = aggregateByCheck(tableRows);
  const passTotal = ok; const warnTotal = wn; const covPct = passRate;

  // summary cards
  const covBar = `
    <div class="cov-bar">
      <div class="cov-pass" style="width:${Math.round(ok*100/total||0)}%"></div>
      <div class="cov-warn" style="width:${Math.round(wn*100/total||0)}%"></div>
      <div class="cov-fail" style="width:${Math.round((fl+er)*100/total||0)}%"></div>
    </div>
    <div class="cov-text">${passChecks} of ${totalChecks} checks passed across ${total} table(s) — ${passRate}% pass rate</div>`;

  const cards = `
    <div class="cards">
      <div class="card pass" data-tip="Tables where every check passed"><div class="num">${ok}</div><div class="lbl">Pass</div></div>
      <div class="card warn" data-tip="Tables with at least one warning but no failures"><div class="num">${wn}</div><div class="lbl">Warn</div></div>
      <div class="card fail" data-tip="Tables with at least one failing check"><div class="num">${fl}</div><div class="lbl">Fail</div></div>
      <div class="card error" data-tip="Tables where a check threw an exception (Spark/Iceberg error)"><div class="num">${er}</div><div class="lbl">Error</div></div>
      <div class="card skip" data-tip="Tables where all checks were skipped (no applicable checks for this mode)"><div class="num">${sk}</div><div class="lbl">Skip</div></div>
      <div class="card cov-card"><div class="lbl">Coverage</div>${covBar}</div>
    </div>
    <div class="cards-sub">Each tile = tables by worst check status. A table is PASS only if every check passes. See Checks Summary below for per-check breakdown.</div>`;

  // checks summary table
  const checkRows = checkAgg.filter(c => activeCheckKeys.has(c.key)).map(c => {
    const nonSkip = c.total - c.skip;
    const pr = nonSkip > 0 ? Math.round(c.pass * 100 / nonSkip) : 0;
    const dotCls = c.fail > 0 || c.error > 0 ? 'fail' : c.warn > 0 ? 'warn' : 'pass';
    return `<tr>
      <td><span class="dot ${dotCls}"></span><span ${c.desc?`data-tip="${esc(c.desc)}"`:''} style="cursor:${c.desc?'help':'default'}">${esc(c.icon)} ${esc(c.label)}</span></td>
      <td class="r ${c.pass>0?'pass':''}">${c.pass||0}</td><td class="r ${c.warn>0?'warn':''}">${c.warn||0}</td>
      <td class="r ${c.fail>0?'fail':''}">${c.fail||0}</td><td class="r ${c.error>0?'error':''}">${c.error||0}</td>
      <td class="r">${c.skip||0}</td><td class="r">${c.total}</td>
      <td><div class="rate-cell"><div class="mini-bar" style="display:flex"><div class="mini-fill" style="width:${pr}%"></div></div>${pr}%</div></td>
    </tr>`;
  }).join('');

  const summaryTable = `
    <div class="sec-title">Checks Summary</div>
    <table class="stbl">
      <thead><tr>
        <th>Check</th><th class="r">Pass</th><th class="r">Warn</th>
        <th class="r">Fail</th><th class="r">Error</th><th class="r">Skip</th>
        <th class="r">Total</th><th>Pass Rate</th>
      </tr></thead>
      <tbody>${checkRows}</tbody>
    </table>`;

  // Bucket summary table
  const bucketRowsHtml = CLS_LIST.map(cls => {
    const br = tableRows.filter(r => r.classification === cls);
    if (br.length === 0) return `<tr><td><span class="cls-badge ${cls}">${cls.toUpperCase()}</span></td><td class="r" colspan="5" style="color:var(--txt2)">— no tables in this bucket</td></tr>`;
    const bOk = br.filter(r=>rowOverallStatus(r)==='pass').length;
    const bWn = br.filter(r=>rowOverallStatus(r)==='warn').length;
    const bFl = br.filter(r=>rowOverallStatus(r)==='fail').length;
    const bEr = br.filter(r=>rowOverallStatus(r)==='error').length;
    return `<tr>
      <td><span class="cls-badge ${cls}">${cls.toUpperCase()}</span></td>
      <td class="r">${br.length}</td>
      <td class="r pass">${bOk||0}</td>
      <td class="r warn">${bWn||0}</td>
      <td class="r fail">${bFl||0}</td>
      <td class="r error">${bEr||0}</td>
    </tr>`;
  }).join('');
  const bucketSummary = `
    <div class="sec-title">Bucket Summary</div>
    <table class="stbl">
      <thead><tr>
        <th>Bucket</th><th class="r">Tables</th><th class="r">Pass</th>
        <th class="r">Warn</th><th class="r">Fail</th><th class="r">Error</th>
      </tr></thead>
      <tbody>${bucketRowsHtml}</tbody>
    </table>`;

  // Instance sections (grouped by namespace)
  const namespaces = [...new Set(tableRows.map(r => r.namespace||''))];
  const instHtml = namespaces.map(ns => renderInstance(ns, tableRows.filter(r=>r.namespace===ns))).join('');

  document.getElementById('content-root').innerHTML = cards + summaryTable + bucketSummary + instHtml;
}

function renderInstance(ns, rows) {
  const nsOk  = rows.filter(r=>rowOverallStatus(r)==='pass').length;
  const nsWn  = rows.filter(r=>rowOverallStatus(r)==='warn').length;
  const nsFl  = rows.filter(r=>rowOverallStatus(r)==='fail').length;
  const nsEr  = rows.filter(r=>rowOverallStatus(r)==='error').length;
  const icon  = (nsFl+nsEr) > 0 ? '✗' : nsWn > 0 ? '△' : '✓';
  const badges = [
    nsOk  > 0 ? `<span class="ibadge pass">${nsOk} pass</span>`  : '',
    nsWn  > 0 ? `<span class="ibadge warn">${nsWn} warn</span>`  : '',
    nsFl  > 0 ? `<span class="ibadge fail">${nsFl} fail</span>`  : '',
    nsEr  > 0 ? `<span class="ibadge error">${nsEr} error</span>` : '',
  ].join('');

  const id = 'inst-' + ns.replace(/\W/g,'_');

  // Sub-group by bucket (optin → pii → optout), then by check type within each bucket
  const CLS_LABELS = {optin:'OPTIN', pii:'PII', optout:'OPTOUT'};
  const bucketsHtml = CLS_LIST.map(cls => {
    const clsRows = rows.filter(r => r.classification === cls);
    if (clsRows.length === 0) return '';
    const clsId = id + '-' + cls;
    const cOk = clsRows.filter(r=>rowOverallStatus(r)==='pass').length;
    const cWn = clsRows.filter(r=>rowOverallStatus(r)==='warn').length;
    const cFl = clsRows.filter(r=>rowOverallStatus(r)==='fail').length;
    const cEr = clsRows.filter(r=>rowOverallStatus(r)==='error').length;
    const clsBadges = [
      cOk>0?`<span class="ibadge pass">${cOk} pass</span>`:'',
      cWn>0?`<span class="ibadge warn">${cWn} warn</span>`:'',
      cFl>0?`<span class="ibadge fail">${cFl} fail</span>`:'',
      cEr>0?`<span class="ibadge error">${cEr} error</span>`:'',
    ].join('');
    const checkGroups = CHECK_TYPES.map(ct => {
      if (!activeCheckKeys.has(ct.key)) return '';
      if (filterCheck !== 'all' && filterCheck !== ct.key) return '';
      const visRows = clsRows.filter(r => matchesFilter(r, ct.key));
      if (visRows.length === 0) return '';
      return renderGroup(ct, visRows, clsId);
    }).join('');
    if (!checkGroups.trim()) return '';
    return `
    <div class="bkt">
      <div class="bkt-hdr" onclick="toggleGrp('${clsId}')">
        <span class="bkt-name"><span class="cls-badge ${cls}">${CLS_LABELS[cls]}</span> ${CLS_ICONS[cls]} <span style="font-weight:400;color:var(--txt2)">${clsRows.length} table(s)</span></span>
        <span class="grp-badges">${clsBadges}</span>
        <span class="chev open" id="${clsId}-chev">▶</span>
      </div>
      <div id="${clsId}-body">${checkGroups}</div>
    </div>`;
  }).join('');

  if (!bucketsHtml.trim()) return '';

  return `
  <div class="inst" id="${id}">
    <div class="inst-hdr" onclick="toggleInst('${id}')">
      <span class="inst-icon">${icon}</span>
      <span class="inst-name">${esc(ns)}</span>
      <span class="inst-badges">${badges}</span>
      <span class="chev open" id="${id}-chev">▶</span>
    </div>
    <div id="${id}-body">${bucketsHtml}</div>
  </div>`;
}

function renderGroup(ct, rows, parentId) {
  const gOk = rows.filter(r=>checkStatus(r,ct.key).s==='pass').length;
  const gWn = rows.filter(r=>checkStatus(r,ct.key).s==='warn').length;
  const gFl = rows.filter(r=>checkStatus(r,ct.key).s==='fail').length;
  const gEr = rows.filter(r=>checkStatus(r,ct.key).s==='error').length;
  const badges = [
    gOk>0?`<span class="ibadge pass">${gOk} pass</span>`:'',
    gWn>0?`<span class="ibadge warn">${gWn} warn</span>`:'',
    gFl>0?`<span class="ibadge fail">${gFl} fail</span>`:'',
    gEr>0?`<span class="ibadge error">${gEr} error</span>`:'',
  ].join('');

  const gid = parentId + '-' + ct.key;
  const tableHtml = renderCheckTable(ct, rows);

  return `
  <div class="grp">
    <div class="grp-hdr" onclick="toggleGrp('${gid}')">
      <span class="grp-name">${ct.icon} ${ct.label.toUpperCase()}</span>
      <span class="grp-badges">${badges}</span>
      <span class="chev open" id="${gid}-chev">▶</span>
    </div>
    <div id="${gid}-body">${tableHtml}</div>
  </div>`;
}

function renderCheckTable(ct, rows) {
  const HEADER_TIPS = {
    'DELTA': '% change in row count between the two most recent Iceberg snapshots. WARN if >20%. — means only one snapshot exists (first load or snapshots expired).',
    'ROW COUNT': 'Total rows in the Iceberg table, read from the .files manifest (no data scan).',
    'SOURCE ROWS': 'Rows counted from source parquet file footers (no data read).',
    'TARGET ROWS': 'Rows counted from Iceberg Silver table manifest.',
    'LAST SNAPSHOT': 'Timestamp of the most recent Iceberg snapshot write.',
    'HIGH NULL COLUMNS': 'Columns with null rate above threshold. Incremental: PK cols only (>75%). Full-load: all cols >20%.',
    'BUCKET': 'S3 Table bucket classification: optin, pii, or optout.',
  };
  const headers = {
    row_count:       ['TABLE','ROW COUNT','DELTA','STATUS'],
    source_target:   ['TABLE','SOURCE ROWS','TARGET ROWS','DELTA','DATE FOLDER','STATUS'],
    schema_contract: ['TABLE','COLUMNS','STATUS'],
    null_rate:       ['TABLE','HIGH NULL COLUMNS','STATUS'],
    freshness:       ['TABLE','LAST SNAPSHOT','STATUS'],
    cls_routing:     ['TABLE','BUCKET','DETAIL','STATUS'],
  };
  const hdrs = headers[ct.key] || ['TABLE','DETAIL','STATUS'];
  const thHtml = hdrs.map((h,i)=>{
    const tip = HEADER_TIPS[h];
    return `<th${i>0&&i<hdrs.length-1?' class="r"':''}>${tip?`<span data-tip="${esc(tip)}">${h}</span>`:h}</th>`;
  }).join('');

  const tdRows = rows.map(r => {
    const cs = checkStatus(r, ct.key);
    const sbadge = `<span class="sbadge ${cs.s}">${cs.s.toUpperCase()}</span>`;
    const tbl = `<td><b>${esc(r.table)}</b></td>`;
    let cells = '';

    if (ct.key === 'row_count') {
      const rc  = (r.row_count??0).toLocaleString();
      const dp  = r.row_delta_pct != null ? `${r.row_delta_pct>0?'+':''}${r.row_delta_pct.toFixed(1)}%` : '—';
      cells = `<td class="r">${rc}</td><td class="r">${dp}</td>`;
    } else if (ct.key === 'source_target') {
      const src  = r.source_count_source_rows != null ? r.source_count_source_rows.toLocaleString() : '—';
      const tgt  = r.source_count_target_rows != null ? r.source_count_target_rows.toLocaleString() : '—';
      const dlt  = r.source_count_delta       != null ? r.source_count_delta.toLocaleString()        : '—';
      const df   = esc(r.source_count_date_folder || cs.detail || '—');
      cells = `<td class="r">${src}</td><td class="r">${tgt}</td><td class="r">${dlt}</td><td class="r">${df}</td>`;
    } else if (ct.key === 'schema_contract') {
      const missing = (r.schema_contract_missing||[]).join(', ') || '—';
      cells = `<td class="r">${r.column_count??'?'} cols${missing!=='—'?'<div class="detail">missing: '+esc(missing)+'</div>':''}</td>`;
    } else if (ct.key === 'null_rate') {
      const hn = r.high_nulls || {};
      const cols = Object.entries(hn).sort((a,b)=>b[1]-a[1]);
      const txt = cols.length > 0
        ? cols.map(([c,v])=>`${esc(c)}=${v}%`).join('&nbsp;&nbsp;')
        : r.pk_null_status === 'FAIL' ? 'PK nulls'
        : r.pk_null_status === 'WARN' ? 'PK partial nulls'
        : '—';
      cells = `<td>${txt}</td>`;
    } else if (ct.key === 'freshness') {
      const snap = r.last_snapshot_hours_ago != null ? `${r.last_snapshot_hours_ago}h ago` : '—';
      cells = `<td class="r">${snap}</td>`;
    } else if (ct.key === 'cls_routing') {
      const cls = r.classification || '?';
      const bkt = `<span class="cls-badge ${cls}">${cls.toUpperCase()}</span>`;
      cells = `<td class="r">${bkt}</td><td>${esc(cs.detail)}</td>`;
    }
    return `<tr>${tbl}${cells}<td>${sbadge}</td></tr>`;
  }).join('');

  return `<table class="rtbl">
    <thead><tr>${thHtml}</tr></thead>
    <tbody>${tdRows}</tbody>
  </table>`;
}

renderContent();

// ── Toggle helpers ────────────────────────────────────────────────────────
function toggleInst(id) {
  const body = document.getElementById(id+'-body');
  const chev = document.getElementById(id+'-chev');
  const hidden = body.classList.toggle('hidden');
  chev.classList.toggle('open', !hidden);
}
function toggleGrp(id) {
  const body = document.getElementById(id+'-body');
  const chev = document.getElementById(id+'-chev');
  const hidden = body.classList.toggle('hidden');
  chev.classList.toggle('open', !hidden);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
